<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden — Sửa giờ chấm công</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
            background: #f5f6f8;
            color: #222;
            padding: 24px;
        }
        h1 { font-size: 18px; margin-bottom: 16px; color: #333; }
        h1 .right { float: right; font-size: 13px; font-weight: 400; color: #666; }

        /* ── Login ── */
        #login { max-width: 320px; margin: 80px auto; background: white;
                padding: 28px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        #login input { width: 100%; padding: 10px 12px; border: 1px solid #ccc;
                       border-radius: 6px; margin: 10px 0; font-size: 14px; }
        #login button { width: 100%; padding: 11px; background: #3b82f6; color: white;
                       border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        #login button:hover { background: #2563eb; }
        #login .err { color: #dc2626; font-size: 13px; min-height: 16px; }

        /* ── Main ── */
        #main { display: none; max-width: 1100px; margin: 0 auto; }
        .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .topbar input[type="text"] { padding: 7px 10px; border: 1px solid #d1d5db;
                                     border-radius: 6px; font-size: 14px; flex: 1; max-width: 280px; }
        .topbar button { padding: 7px 12px; border: 1px solid #d1d5db; background: white;
                         border-radius: 6px; font-size: 13px; cursor: pointer; }
        .topbar button.primary { background: #3b82f6; color: white; border-color: #3b82f6; }
        .topbar .logout { margin-left: auto; }

        /* ── Table ── */
        table { width: 100%; border-collapse: collapse; background: white;
                border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e5e7eb;
                 font-size: 14px; }
        th { background: #f9fafb; font-weight: 600; color: #4b5563;
             font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
        tr:hover td { background: #f9fafb; }
        td.center, th.center { text-align: center; }
        td.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
        td input[type="time"] { padding: 4px 6px; border: 1px solid #d1d5db;
                                border-radius: 4px; font-size: 13px; width: 110px; }
        td .clear { background: none; border: none; color: #9ca3af; cursor: pointer;
                    font-size: 16px; margin-left: 4px; padding: 0 4px; }
        td .clear:hover { color: #dc2626; }
        td button.save { padding: 5px 10px; background: #10b981; color: white;
                         border: none; border-radius: 4px; font-size: 13px;
                         cursor: pointer; }
        td button.save:hover { background: #059669; }
        td button.save:disabled { background: #d1d5db; cursor: not-allowed; }
        .row-saved { background: #ecfdf5 !important; transition: background .5s; }
        .row-error { background: #fef2f2 !important; }
        .empty { padding: 40px; text-align: center; color: #9ca3af; }

        /* ── Toast ── */
        #toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px;
                 border-radius: 6px; background: #1f2937; color: white; font-size: 13px;
                 display: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        #toast.err { background: #dc2626; }
        #toast.ok { background: #10b981; }
    </style>
</head>
<body>
    <h1 style="display: none;" id="pageTitle">Sửa giờ chấm công</h1>

    <!-- Login -->
    <div id="login">
        <h2 style="margin-bottom: 14px; font-size: 18px;">🔒 Đăng nhập</h2>
        <input type="password" id="password" placeholder="Mật khẩu"
               onkeydown="if(event.key==='Enter')login()">
        <button onclick="login()">Đăng nhập</button>
        <div class="err" id="loginErr"></div>
    </div>

    <!-- Main -->
    <div id="main">
        <div class="topbar">
            <input type="text" id="filter" placeholder="🔍 Lọc theo mã NV hoặc tên..."
                   oninput="applyFilter()">
            <button onclick="loadList()">↻ Tải lại</button>
            <button class="logout" onclick="logout()">Đăng xuất</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 50px;" class="center">STT</th>
                    <th style="width: 90px;">Mã NV</th>
                    <th>Họ tên</th>
                    <th style="width: 110px;" class="center">Ngày</th>
                    <th style="width: 140px;" class="center">Checkin</th>
                    <th style="width: 140px;" class="center">Checkout</th>
                    <th style="width: 90px;" class="center">Lưu</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" style="display: none;">Không có bản ghi nào.</div>
    </div>

    <div id="toast"></div>

    <script>
    const API_LIST = '/api/hidden/attendance';
    const API_LOGIN = '/api/hidden/login';
    const TOKEN_KEY = 'hidden_token';
    const TOKEN_EXP_KEY = 'hidden_token_exp';
    let rows = [];   // last fetched list
    let filter = '';

    // ── Auth ────────────────────────────────────────────────────────────────
    function getToken() { return sessionStorage.getItem(TOKEN_KEY) || ''; }
    function saveToken(t, exp) {
        sessionStorage.setItem(TOKEN_KEY, t);
        sessionStorage.setItem(TOKEN_EXP_KEY, String(Date.now() + exp * 1000));
    }
    function clearToken() {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(TOKEN_EXP_KEY);
    }
    function authHeaders(extra = {}) {
        const h = Object.assign({}, extra);
        const t = getToken();
        if (t) h['X-Hidden-Token'] = t;
        return h;
    }
    function tokenExpired() {
        const e = parseInt(sessionStorage.getItem(TOKEN_EXP_KEY) || '0', 10);
        return !e || Date.now() >= e;
    }

    // ── Login flow ──────────────────────────────────────────────────────────
    async function login() {
        const pw = document.getElementById('password').value;
        const errEl = document.getElementById('loginErr');
        errEl.textContent = '';
        if (!pw) return;
        try {
            const r = await fetch(API_LOGIN, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw }),
            });
            if (!r.ok) {
                const d = await r.json().catch(() => ({}));
                errEl.textContent = d.detail || `Lỗi ${r.status}`;
                return;
            }
            const data = await r.json();
            saveToken(data.token, data.expires_in);
            document.getElementById('password').value = '';
            showMain();
        } catch (e) {
            errEl.textContent = 'Lỗi kết nối';
        }
    }
    function logout() {
        clearToken();
        document.getElementById('main').style.display = 'none';
        document.getElementById('login').style.display = 'block';
    }
    async function checkSession() {
        if (!getToken() || tokenExpired()) {
            clearToken();
            document.getElementById('login').style.display = 'block';
            return;
        }
        // Probe with a tiny request to confirm token is still valid.
        try {
            const r = await fetch(API_LIST, { headers: authHeaders() });
            if (r.status === 401) {
                clearToken();
                document.getElementById('login').style.display = 'block';
                return;
            }
            if (r.ok) {
                showMain();
                return;
            }
        } catch {}
        // If we can't reach, still let user try.
        showMain();
    }
    function showMain() {
        document.getElementById('login').style.display = 'none';
        document.getElementById('main').style.display = 'block';
        document.getElementById('pageTitle').style.display = 'block';
        loadList();
    }

    // ── Load list ───────────────────────────────────────────────────────────
    async function loadList() {
        const tbody = document.getElementById('tbody');
        const empty = document.getElementById('empty');
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#9ca3af;">Đang tải...</td></tr>';
        try {
            const r = await fetch(API_LIST, { headers: authHeaders() });
            if (r.status === 401) { clearToken(); return; }
            if (!r.ok) {
                const d = await r.json().catch(() => ({}));
                toast(d.detail || `Lỗi ${r.status}`, 'err');
                tbody.innerHTML = '';
                return;
            }
            rows = await r.json();
            renderRows();
        } catch (e) {
            toast('Lỗi kết nối', 'err');
        }
    }

    // ── Render ──────────────────────────────────────────────────────────────
    function renderRows() {
        const tbody = document.getElementById('tbody');
        const empty = document.getElementById('empty');
        const f = filter.trim().toLowerCase();
        const view = !f ? rows : rows.filter(r =>
            (r.employee_code || '').toLowerCase().includes(f) ||
            (r.employee_name || '').toLowerCase().includes(f)
        );
        if (!view.length) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        tbody.innerHTML = view.map((r, i) => {
            const ci = r.checkin_time ? toHHMM(r.checkin_time) : '';
            const co = r.checkout_time ? toHHMM(r.checkout_time) : '';
            return `
                <tr data-id="${r.id}" data-emp-id="${r.employee_id}">
                    <td class="center mono">${i + 1}</td>
                    <td class="mono">${escapeHtml(r.employee_code || '')}</td>
                    <td>${escapeHtml(r.employee_name || '')}</td>
                    <td class="center mono">${r.date}</td>
                    <td class="center">
                        <input type="time" class="ci" value="${ci}">
                        <button class="clear" title="Xóa giờ checkin">✕</button>
                    </td>
                    <td class="center">
                        <input type="time" class="co" value="${co}">
                        <button class="clear" title="Xóa giờ checkout">✕</button>
                    </td>
                    <td class="center">
                        <button class="save">💾 Lưu</button>
                    </td>
                </tr>
            `;
        }).join('');

        // Wire up clear + save buttons.
        tbody.querySelectorAll('tr').forEach(tr => {
            const id = tr.dataset.id;
            const ciInput = tr.querySelector('.ci');
            const coInput = tr.querySelector('.co');
            const saveBtn = tr.querySelector('button.save');
            const clears = tr.querySelectorAll('button.clear');

            clears[0].addEventListener('click', () => { ciInput.value = ''; });
            clears[1].addEventListener('click', () => { coInput.value = ''; });

            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                saveBtn.textContent = '⏳';
                const payload = {
                    checkin: ciInput.value || null,
                    checkout: coInput.value || null,
                };
                try {
                    const r = await fetch(`${API_LIST}/${id}/times`, {
                        method: 'PATCH',
                        headers: authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify(payload),
                    });
                    if (!r.ok) {
                        const d = await r.json().catch(() => ({}));
                        toast(d.detail || `Lỗi ${r.status}`, 'err');
                        tr.classList.add('row-error');
                        setTimeout(() => tr.classList.remove('row-error'), 1500);
                        return;
                    }
                    const updated = await r.json();
                    // If the row is now both null, the server deleted it.
                    if (!updated.checkin_time && !updated.checkout_time) {
                        rows = rows.filter(x => x.id !== updated.id);
                        tr.classList.add('row-saved');
                        setTimeout(() => tr.remove(), 600);
                        toast('Đã xóa bản ghi (cả 2 giờ trống)', 'ok');
                        return;
                    }
                    // Patch local row in place and re-render.
                    const idx = rows.findIndex(x => x.id === updated.id);
                    if (idx >= 0) rows[idx] = updated;
                    tr.classList.add('row-saved');
                    setTimeout(() => tr.classList.remove('row-saved'), 1200);
                    toast('Đã lưu', 'ok');
                } catch (e) {
                    toast('Lỗi kết nối', 'err');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '💾 Lưu';
                }
            });
        });
    }

    function applyFilter() {
        filter = document.getElementById('filter').value;
        renderRows();
    }

    // ── Helpers ─────────────────────────────────────────────────────────────
    function toHHMM(iso) {
        // "2026-09-30T08:30:00" → "08:30"
        if (!iso) return '';
        const m = String(iso).match(/T(\d{2}:\d{2})/);
        return m ? m[1] : '';
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }
    function toast(msg, kind = 'ok') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = kind;
        el.style.display = 'block';
        clearTimeout(toast._t);
        toast._t = setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    // ── Init ────────────────────────────────────────────────────────────────
    checkSession();
    </script>
</body>
</html>
